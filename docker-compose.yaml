services:
  
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=faang
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d faang"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  init-postgres:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=faang
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./faang-infra/init-postgres.sh:/init-postgres.sh
    entrypoint: /bin/bash
    command: /init-postgres.sh
  
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
      - "8001:8001"

  seaweedfs-s3:
    # Local S3-compatible object store for Post/Project/User services (DEP-042B).
    # Single-node SeaweedFS using 'mini' mode (master + volume + filer + s3 in one process).
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    ports:
      - '9000:8333'   # S3 API (services default to http://localhost:9000)
      - '8888:8888'   # Filer HTTP (optional, for browsing)
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-user}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-password}
    volumes:
      - seaweedfs_data:/data
    command: ["mini", "-dir=/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  init-s3-buckets:
    # Creates the required S3 buckets after SeaweedFS is ready (uses AWS CLI).
    image: amazon/aws-cli@sha256:b6aeb95d19d7f5a8cae4eb814cb16739b6b2a4f2f46f427ada6a8c9a20d9881d
    depends_on:
      seaweedfs-s3:
        condition: service_healthy
    environment:
      - S3_ENDPOINT=http://seaweedfs-s3:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-user}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-password}
      - S3_BUCKET_NAME=corpbucket
      - S3_AVATAR_BUCKET_NAME=user-avatars
    entrypoint: ["sh", "-c"]
    command: >
      "aws configure set aws_access_key_id $$S3_ACCESS_KEY &&
      aws configure set aws_secret_access_key $$S3_SECRET_KEY &&
      aws configure set region us-east-1 &&
      aws --endpoint-url $$S3_ENDPOINT s3api head-bucket --bucket $$S3_BUCKET_NAME 2>/dev/null ||
      aws --endpoint-url $$S3_ENDPOINT s3 mb s3://$$S3_BUCKET_NAME &&
      aws --endpoint-url $$S3_ENDPOINT s3api head-bucket --bucket $$S3_AVATAR_BUCKET_NAME 2>/dev/null ||
      aws --endpoint-url $$S3_ENDPOINT s3 mb s3://$$S3_AVATAR_BUCKET_NAME &&
      echo 'S3 buckets ready'"

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: OUTSIDE
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: INSIDE
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./faang-infra/k8s/bootstrap/scripts/init-kafka.sh:/init-kafka.sh:ro
      - ./faang-infra/replay-analytics-dlt.sh:/replay-analytics-dlt.sh
    command: >
      sh -c "
      /etc/kafka/docker/run &
      sleep 30 &&
      /init-kafka.sh &&
      wait"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - indices.memory.index_buffer_size=20%
      - reindex.remote.whitelist=localhost:9200
      - action.auto_create_index=true
      - node.store.allow_mmap=false
      - ELASTICSEARCH_URL=http://localhost:9200
    ports:
      - 9200:9200
      - 9300:9300
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    cap_add:
        - IPC_LOCK
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./faang-infra/k8s/bootstrap/scripts/init-elasticsearch.sh:/init-elasticsearch.sh:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      sh -c "
      /usr/local/bin/docker-entrypoint.sh elasticsearch &
      sleep 30 &&
      /init-elasticsearch.sh &&
      wait"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    environment:
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_LOGGING_VERBOSE=true
      - TELEMETRY_ENABLED=false
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - LOGGING_DEST=stdout
    ports:
      - 5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - kb_data:/usr/share/kibana/data

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  es_data:
    driver: local
  kb_data:
    driver: local
  seaweedfs_data:
    driver: local
