services:
  
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=faang
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d faang"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  init-postgres:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=faang
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./faang-infra/init-postgres.sh:/init-postgres.sh
    entrypoint: /bin/bash
    command: /init-postgres.sh
  
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
      - "8001:8001"
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server --console-address :9001 /data
  
  createbuckets:
    image: minio/mc:RELEASE.2025-04-16T18-53-07Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc config host add minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb minio/corpbucket;
      /usr/bin/mc anonymous set public minio/corpbucket;
      exit 0;
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: OUTSIDE
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: INSIDE
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./faang-infra/init-kafka.sh:/init-kafka.sh
      - ./faang-infra/replay-analytics-dlt.sh:/replay-analytics-dlt.sh
    command: >
      sh -c "
      /etc/kafka/docker/run &
      sleep 30 &&
      /init-kafka.sh &&
      wait"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/lasticsearch:9.5.2
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - indices.memory.index_buffer_size=20%
      - reindex.remote.whitelist=localhost:9200
      - action.auto_create_index=true
      - node.store.allow_mmap=false
    ports:
      - 9200:9200
      - 9300:9300
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    cap_add:
        - IPC_LOCK
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./faang-infra/init-elastic.sh:/init-elastic.sh
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      sh -c "
      /usr/local/bin/docker-entrypoint.sh elasticsearch &
      sleep 30 &&
      /init-elastic.sh &&
      wait"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    environment:
      - SERVER_HOST=0.0.0.0
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_LOGGING_VERBOSE=true
      - TELEMETRY_ENABLED=false
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - LOGGING_DEST=stdout
    ports:
      - 5601:5601
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - kb_data:/usr/share/kibana/data

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  es_data:
    driver: local
  kb_data:
    driver: local
  minio_data:
    driver: local
